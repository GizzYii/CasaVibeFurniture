<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Indie+Flower&family=Liter&family=Lobster&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #ebece7 0%, #e5e5e5 100%);
        min-height: 100vh;
        padding: 2rem;
        font-family: Arial, sans-serif;
        padding-top: 20px;
      }
      nav {
        background: linear-gradient(135deg, #eee3e3 10%, #beb3a4 90%);
      }

      .contact-section label,
      .contact-section p,
      .contact-section h3,
      .contact-section h4 {
        color: #c29a63;
      }

      .contact-section input,
      .contact-section textarea {
        color: #c29a63;
      }

      .contact-section input:focus,
      .contact-section textarea:focus {
        border-color: #f3c6d3;
      }
    </style>
  </head>

  <body style="background-color: #ebe4e3e3">
    <!-- (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a
          class="navbar-brand text-warning-emphasis fw-bold"
          style="font-family: Dancing Script, serif"
          href="index.html"
          >CasaVibe</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link"
                style="color: rgb(110, 51, 6)"
                href="index.html"
                >HomePage</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                style="color: rgb(110, 51, 6)"
                href="products.html"
                >Products</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                style="color: rgb(110, 51, 6)"
                href="contactUs.html"
                >Contact Us</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div style="height: 100px; overflow: hidden">
      <svg
        viewBox="0 0 500 150"
        preserveAspectRatio="none"
        style="height: 100%; width: 100%"
      >
        <path
          d="M-7.05,33.81 C149.99,150.00 271.69,-49.98 501.34,105.38 L500.00,0.00 L0.00,0.00 Z"
          style="stroke: none; fill: #a79d93"
        ></path>
      </svg>
    </div>

    <section class="contact-section py-1 mt-2">
      <div class="container">
        <div class="row justify-content-center align-items-center">
          <!-- Contact Form -->
          <div class="col-md-6 mb-4">
            <div class="card contact-card shadow-sm p-4">
              <h3 class="card-title text-center mb-4">Contact Us</h3>
              <form>
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Your full name"
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control small-input"
                    id="email"
                    placeholder="your@gmail.com"
                  />
                </div>
                <div class="mb-3">
                  <label for="message" class="form-label">Message</label>
                  <textarea
                    class="form-control"
                    id="message"
                    rows="4"
                    placeholder="Type your message here..."
                  ></textarea>
                </div>
                <button
                  type="submit"
                  class="btn btn-transparent w-100"
                  style="color: #c29a63"
                >
                  Send Message
                </button>
              </form>
            </div>
          </div>

          <!-- Contact Info -->
          <div class="col-md-5">
            <div class="card contact-info-card shadow-sm p-4">
              <h4 class="mb-3">Get in Touch</h4>
              <p>
                <strong>📍 Address:</strong> 123 Furniture Lane, Design City,
                USA
              </p>
              <p><strong>📞 Phone:</strong> +1 234 567 890</p>
              <p><strong>✉️ Email:</strong> contact@furnishplus.com</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  </body>
</html>
